<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Ninja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #fff7e6; --accent: #ffcc33; --danger: #ff4d4d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg, #0b1a2e); font-family: 'Nunito', system-ui, sans-serif; color: var(--ink); user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  .hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 16px 20px; pointer-events: none; z-index: 2; }
  .score-box, .lives-box { font-family: 'Bangers', cursive; font-size: 2.2rem; letter-spacing: 2px; text-shadow: 0 3px 0 #000, 0 0 12px rgba(0,0,0,.5); }
  .lives-box { display: flex; gap: 6px; font-size: 1.8rem; }
  .life { color: var(--danger); transition: opacity .3s, transform .3s; }
  .life.lost { opacity: .18; transform: scale(.7); }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(ellipse at center, rgba(11,26,46,.55), rgba(11,26,46,.92)); z-index: 3; text-align: center; padding: 24px; }
  .overlay.hidden { display: none; }
  h1 { font-family: 'Bangers', cursive; font-size: clamp(3.2rem, 12vw, 6.5rem); letter-spacing: 4px; color: var(--accent); text-shadow: 0 6px 0 var(--accent-shadow, #b35c00), 0 0 30px rgba(255,204,51,.45); transform: rotate(-4deg); }
  h1 span { color: #7dff6b; text-shadow: 0 6px 0 #1f7a14, 0 0 30px rgba(125,255,107,.4); }
  p.sub { max-width: 420px; line-height: 1.5; opacity: .9; font-size: 1.05rem; }
  .final { font-family: 'Bangers', cursive; font-size: 2.6rem; color: var(--accent); letter-spacing: 2px; }
  .best { font-weight: 800; opacity: .8; }
  button { font-family: 'Bangers', cursive; font-size: 1.9rem; letter-spacing: 2px; padding: 12px 44px; border: none; border-radius: 999px; background: linear-gradient(#ffe066, #ff9f1a); color: #3b1d00; box-shadow: 0 6px 0 #b35c00, 0 10px 24px rgba(0,0,0,.35); cursor: pointer; transition: transform .08s, box-shadow .08s; }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #b35c00; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .combo { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); font-family: 'Bangers', cursive; font-size: clamp(2rem, 7vw, 3.8rem); color: #7dff6b; text-shadow: 0 4px 0 #000; pointer-events: none; opacity: 0; z-index: 2; white-space: nowrap; }
  .combo.show { animation: pop .9s ease-out forwards; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -110%) scale(1); } }
  @media (prefers-reduced-motion: reduce) { .combo.show { animation-duration: .01s; } }
  :focus-visible { outline: 3px solid #fff; }
  .theme-picker { display: flex; align-items: center; gap: 10px; font-weight: 800; }
  .theme-picker select { font: inherit; font-weight: 800; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--accent, #ffcc33); background: rgba(0,0,0,.35); color: var(--ink); cursor: pointer; }
  .theme-picker select:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .fruit-picker { border: 2px solid var(--accent, #ffcc33); border-radius: 12px; padding: 8px 14px 12px; background: rgba(0,0,0,.35); }
  .fruit-picker legend { font-weight: 800; padding: 0 6px; }
  #fruitOptions { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; }
  #fruitOptions label { display: flex; align-items: center; gap: 6px; font-weight: 800; cursor: pointer; text-transform: capitalize; }
  #fruitOptions input:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #bladeOptions { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; }
  #bladeOptions label { display: flex; align-items: center; gap: 6px; font-weight: 800; cursor: pointer; }
  #bladeOptions input:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #bladeOptions .swatch { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; }
</style>
</head>
<body>
<canvas id="game" aria-label="Fruit Ninja game area. Swipe or drag across fruit to slice it. Avoid bombs."></canvas>

<div class="hud" aria-live="polite">
  <div class="score-box" id="score">0</div>
  <div class="lives-box" id="lives" aria-label="Lives"></div>
</div>
<div class="combo" id="combo"></div>

<div class="overlay" id="menu">
  <h1>FRUIT <span>NINJA</span></h1>
  <p class="sub">Swipe across the fruit to slice it. Each fruit you let fall costs a life. Slice a bomb and it's game over.</p>
  <p class="best" id="bestMenu"></p>
  <label class="theme-picker">Theme
    <select id="themeSelect">
      <option value="classic">Classic</option>
      <option value="sunset">Sunset</option>
      <option value="neon">Neon Night</option>
      <option value="jungle">Jungle</option>
      <option value="ocean">Ocean</option>
      <option value="candy">Candy</option>
      <option value="arctic">Arctic</option>
      <option value="desert">Desert</option>
      <option value="random">Random</option>
    </select>
  </label>
  <fieldset class="fruit-picker blade-picker">
    <legend>Blade</legend>
    <div id="bladeOptions" role="radiogroup" aria-label="Blade color"></div>
  </fieldset>
  <fieldset class="fruit-picker">
    <legend>Fruit</legend>
    <div id="fruitOptions"></div>
  </fieldset>
  <button id="startBtn">START</button>
</div>

<div class="overlay hidden" id="gameover">
  <h1>GAME <span>OVER</span></h1>
  <div class="final" id="finalScore">0</div>
  <p class="best" id="bestOver"></p>
  <button id="againBtn">PLAY AGAIN</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const comboEl = document.getElementById('combo');
  const menu = document.getElementById('menu');
  const gameover = document.getElementById('gameover');
  const finalScoreEl = document.getElementById('finalScore');
  const bestMenu = document.getElementById('bestMenu');
  const bestOver = document.getElementById('bestOver');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const MAX_LIVES = 3;
  const GRAVITY = 1400;
  const FRUITS = [
    { name: 'watermelon', color: '#3fbf4a', inner: '#ff5a6e', rind: '#1e7a2b', r: 46 },
    { name: 'orange',     color: '#ff9a1f', inner: '#ffb347', rind: '#c26a00', r: 38 },
    { name: 'kiwi',       color: '#8a5a2b', inner: '#9ce05a', rind: '#5c3b19', r: 32 },
    { name: 'apple',      color: '#e03a3a', inner: '#fff3c4', rind: '#9b1b1b', r: 36 },
    { name: 'lemon',      color: '#ffe03a', inner: '#fff7a0', rind: '#c9a600', r: 30 },
    { name: 'banana',     color: '#ffd84d', inner: '#fff1b0', rind: '#b58b00', r: 34 },
  ];
  const BOMB = { name: 'bomb', r: 34 };

  const THEMES = {
    classic: { label: 'Classic', top: '#1b3a63', bottom: '#0b1a2e', accent: '#ffcc33', shadow: '#b35c00', bg: '#0b1a2e' },
    sunset:  { label: 'Sunset',  top: '#ff8a5b', bottom: '#5b1f4a', accent: '#ffe08a', shadow: '#8a2d00', bg: '#3a1234' },
    neon:    { label: 'Neon Night', top: '#1a0b33', bottom: '#050510', accent: '#ff3cf0', shadow: '#7a0a6e', bg: '#050510' },
    jungle:  { label: 'Jungle',  top: '#2f7a4a', bottom: '#0f2e1c', accent: '#c6ff5a', shadow: '#3d6b10', bg: '#0f2e1c' },
    ocean:   { label: 'Ocean',   top: '#48c9d9', bottom: '#0b4f7a', accent: '#9ff3ff', shadow: '#063a5c', bg: '#0b4f7a' },
    candy:   { label: 'Candy',   top: '#ffb3de', bottom: '#8e5bd6', accent: '#fff36b', shadow: '#6a2aa8', bg: '#8e5bd6' },
    arctic:  { label: 'Arctic',  top: '#e8f6ff', bottom: '#7fa9c9', accent: '#2a6fb0', shadow: '#3d6d8f', bg: '#7fa9c9' },
    desert:  { label: 'Desert',  top: '#ffd28a', bottom: '#b5542a', accent: '#fff0b3', shadow: '#7a3212', bg: '#b5542a' },
  };
  const BLADES = {
    white:  { label: 'White',  color: '#ffffff' },
    gold:   { label: 'Gold',   color: '#ffcc33' },
    cyan:   { label: 'Cyan',   color: '#5ef0ff' },
    pink:   { label: 'Pink',   color: '#ff6bd6' },
    lime:   { label: 'Lime',   color: '#b6ff5a' },
    red:    { label: 'Red',    color: '#ff4d4d' },
    orange: { label: 'Orange', color: '#ff9a1f' },
    blue:   { label: 'Blue',   color: '#3d7bff' },
    purple: { label: 'Purple', color: '#a66bff' },
    green:  { label: 'Green',  color: '#3fbf4a' },
  };
  const bladeOptions = document.getElementById('bladeOptions');
  let blade = localStorage.getItem('fruitNinjaBlade');
  if (blade !== 'random' && !BLADES[blade]) blade = 'white';
  let activeBlade = blade === 'random' ? randomKey(BLADES) : blade;
  Object.entries(BLADES).forEach(([key, b]) => {
    const label = document.createElement('label');
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'blade';
    radio.value = key;
    radio.checked = key === blade;
    radio.addEventListener('change', () => {
      blade = key;
      localStorage.setItem('fruitNinjaBlade', key);
    });
    const swatch = document.createElement('span');
    swatch.className = 'swatch';
    swatch.style.background = b.color;
    label.append(radio, swatch, b.label);
    bladeOptions.append(label);
  });
  {
    const label = document.createElement('label');
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'blade';
    radio.value = 'random';
    radio.checked = blade === 'random';
    radio.addEventListener('change', () => {
      blade = 'random';
      localStorage.setItem('fruitNinjaBlade', blade);
    });
    label.append(radio, 'Random');
    bladeOptions.append(label);
  }
  const fruitOptions = document.getElementById('fruitOptions');
  const savedFruits = JSON.parse(localStorage.getItem('fruitNinjaFruits') || 'null');
  const enabledFruits = new Set(Array.isArray(savedFruits) ? savedFruits.filter(n => FRUITS.some(f => f.name === n)) : FRUITS.map(f => f.name));
  if (!enabledFruits.size) FRUITS.forEach(f => enabledFruits.add(f.name));
  FRUITS.forEach(f => {
    const label = document.createElement('label');
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.value = f.name;
    box.checked = enabledFruits.has(f.name);
    box.addEventListener('change', () => {
      if (box.checked) enabledFruits.add(f.name);
      else if (enabledFruits.size > 1) enabledFruits.delete(f.name);
      else { box.checked = true; return; }
      localStorage.setItem('fruitNinjaFruits', JSON.stringify([...enabledFruits]));
    });
    label.append(box, f.name);
    fruitOptions.append(label);
  });
  const randomKey = o => { const k = Object.keys(o); return k[Math.floor(Math.random() * k.length)]; };
  const themeSelect = document.getElementById('themeSelect');
  const savedTheme = localStorage.getItem('fruitNinjaTheme');
  let themeChoice = savedTheme === 'random' || THEMES[savedTheme] ? savedTheme : 'classic';
  let theme = themeChoice === 'random' ? randomKey(THEMES) : themeChoice;

  function applyTheme() {
    const t = THEMES[theme];
    const root = document.documentElement.style;
    root.setProperty('--accent', t.accent);
    root.setProperty('--accent-shadow', t.shadow);
    root.setProperty('--bg', t.bg);
    themeSelect.value = themeChoice;
  }
  themeSelect.addEventListener('change', () => {
    themeChoice = themeSelect.value;
    localStorage.setItem('fruitNinjaTheme', themeChoice);
    theme = themeChoice === 'random' ? randomKey(THEMES) : themeChoice;
    applyTheme();
  });
  applyTheme();

  let W = 0, H = 0, dpr = 1;
  let fruits = [], halves = [], particles = [], trail = [];
  let state = 'menu';
  let score = 0, lives = MAX_LIVES, combo = 0, comboTimer = 0;
  let best = Number(localStorage.getItem('fruitNinjaBest') || 0);
  let lastSpawn = 0, nextSpawn = 0.8, elapsed = 0;
  let last = performance.now();
  let pointer = { down: false, x: 0, y: 0 };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function renderLives() {
    livesEl.innerHTML = '';
    for (let i = 0; i < MAX_LIVES; i++) {
      const s = document.createElement('span');
      s.className = 'life' + (i >= lives ? ' lost' : '');
      s.textContent = '♥';
      livesEl.appendChild(s);
    }
    livesEl.setAttribute('aria-label', `Lives: ${lives}`);
  }

  function spawnItem() {
    const isBomb = Math.random() < Math.min(0.08 + elapsed / 300, 0.2);
    const pool = FRUITS.filter(f => enabledFruits.has(f.name));
    const type = isBomb ? BOMB : pool[Math.floor(Math.random() * pool.length)];
    const x = W * (0.15 + Math.random() * 0.7);
    const y = H + type.r;
    const targetX = W * (0.2 + Math.random() * 0.6);
    const vx = (targetX - x) * (0.6 + Math.random() * 0.4);
    const vy = -(Math.sqrt(2 * GRAVITY * (H * (0.55 + Math.random() * 0.35)))) ;
    fruits.push({
      type, isBomb, x, y, vx, vy,
      angle: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 6,
      r: type.r,
      sliced: false,
    });
  }

  function spawnHalves(f, sliceAngle) {
    const nx = Math.cos(sliceAngle + Math.PI / 2), ny = Math.sin(sliceAngle + Math.PI / 2);
    for (const side of [-1, 1]) {
      halves.push({
        type: f.type, x: f.x, y: f.y,
        vx: f.vx * 0.6 + nx * side * 180,
        vy: f.vy * 0.6 + ny * side * 180 - 60,
        angle: f.angle, spin: f.spin + side * 2,
        r: f.r, side, age: 0,
        cut: sliceAngle,
      });
    }
  }

  function burst(x, y, color, count) {
    if (reduceMotion) count = Math.ceil(count / 3);
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 80 + Math.random() * 320;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: 1, color, size: 2 + Math.random() * 4 });
    }
  }

  function sliceAt(x, y, dx, dy) {
    for (const f of fruits) {
      if (f.sliced) continue;
      const cx = f.x, cy = f.y;
      const dist = segPointDist(cx, cy, x - dx, y - dy, x, y);
      if (dist < f.r * 0.9) {
        f.sliced = true;
        if (f.isBomb) {
          explodeBomb(f);
        } else {
          slice(f, Math.atan2(dy, dx));
        }
      }
    }
  }

  function segPointDist(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    let t = len2 ? ((px - x1) * dx + (py - y1) * dy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    const qx = x1 + t * dx - px, qy = y1 + t * dy - py;
    return Math.hypot(qx, qy);
  }

  function slice(f, angle) {
    spawnHalves(f, angle);
    burst(f.x, f.y, f.type.inner, reduceMotion ? 8 : 22);
    burst(f.x, f.y, f.type.color, reduceMotion ? 4 : 10);
    combo = comboTimer > 0 ? combo + 1 : 1;
    comboTimer = 0.6;
    const gained = 1 + Math.max(0, combo - 1);
    score += gained;
    if (combo >= 2) showCombo(`${combo}x COMBO +${gained}`);
    updateScore();
  }

  function explodeBomb(f) {
    burst(f.x, f.y, '#ff7b1a', reduceMotion ? 20 : 60);
    burst(f.x, f.y, '#333', reduceMotion ? 10 : 30);
    flash();
    loseLife();
    if (state === 'playing') endGame();
  }

  function flash() {
    if (reduceMotion) return;
    canvas.animate([{ filter: 'brightness(2.2)' }, { filter: 'brightness(1)' }], { duration: 260 });
  }

  function showCombo(text) {
    comboEl.textContent = text;
    comboEl.classList.remove('show');
    void comboEl.offsetWidth;
    comboEl.classList.add('show');
  }

  function updateScore() { scoreEl.textContent = score; }

  function loseLife() {
    lives = Math.max(0, lives - 1);
    renderLives();
  }

  function missFruit(f) {
    burst(f.x, Math.min(H - 20, Math.max(20, f.y)), f.type.inner, 14);
    loseLife();
    if (lives <= 0 && state === 'playing') endGame();
  }

  function endGame() {
    state = 'over';
    combo = 0; comboTimer = 0;
    pointer.down = false;
    const isBest = score > best;
    if (isBest) { best = score; localStorage.setItem('fruitNinjaBest', String(best)); }
    finalScoreEl.textContent = `Score: ${score}`;
    bestOver.textContent = isBest ? 'New best!' : `Best: ${best}`;
    gameover.classList.remove('hidden');
  }

  function startGame() {
    fruits = []; halves = []; particles = []; trail = [];
    score = 0; lives = MAX_LIVES; combo = 0; comboTimer = 0;
    elapsed = 0; nextSpawn = 0.8; lastSpawn = 0;
    updateScore(); renderLives();
    menu.classList.add('hidden');
    gameover.classList.add('hidden');
    state = 'playing';
  }

  function pointerPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  canvas.addEventListener('pointerdown', e => {
    if (state !== 'playing') return;
    canvas.setPointerCapture(e.pointerId);
    const p = pointerPos(e);
    pointer = { down: true, x: p.x, y: p.y };
    trail = [{ x: p.x, y: p.y, t: performance.now() }];
  });
  canvas.addEventListener('pointermove', e => {
    if (!pointer.down || state !== 'playing') return;
    const p = pointerPos(e);
    const dx = p.x - pointer.x, dy = p.y - pointer.y;
    if (Math.hypot(dx, dy) < 1) return;
    sliceAt(p.x, p.y, dx, dy);
    trail.push({ x: p.x, y: p.y, t: performance.now() });
    pointer.x = p.x; pointer.y = p.y;
  });
  const endPointer = () => { pointer.down = false; };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', endPointer);

  const rollRandom = () => {
    if (themeChoice === 'random') { theme = randomKey(THEMES); applyTheme(); }
    activeBlade = blade === 'random' ? randomKey(BLADES) : blade;
  };
  document.getElementById('startBtn').addEventListener('click', rollRandom);
  document.getElementById('againBtn').addEventListener('click', rollRandom);
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', startGame);
  bestMenu.textContent = best ? `Best: ${best}` : '';

  function update(dt) {
    elapsed += dt;
    comboTimer = Math.max(0, comboTimer - dt);
    if (comboTimer === 0) combo = 0;

    if (state === 'playing') {
      nextSpawn -= dt;
      if (nextSpawn <= 0) {
        const count = 1 + (Math.random() < Math.min(0.15 + elapsed / 120, 0.6) ? 1 : 0)
                      + (elapsed > 30 && Math.random() < 0.2 ? 1 : 0);
        for (let i = 0; i < count; i++) spawnItem();
        nextSpawn = Math.max(0.55, 1.6 - elapsed / 90) * (0.7 + Math.random() * 0.6);
      }
    }

    for (let i = fruits.length - 1; i >= 0; i--) {
      const f = fruits[i];
      f.vy += GRAVITY * dt;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.angle += f.spin * dt;
      if (f.sliced) { fruits.splice(i, 1); continue; }
      if (f.vy > 0 && f.y - f.r > H + 40) {
        fruits.splice(i, 1);
        if (!f.isBomb && state === 'playing') missFruit(f);
      }
    }

    for (let i = halves.length - 1; i >= 0; i--) {
      const h = halves[i];
      h.vy += GRAVITY * dt;
      h.x += h.vx * dt;
      h.y += h.vy * dt;
      h.angle += h.spin * dt;
      h.age += dt;
      if (h.y - h.r > H + 40) halves.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 600 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt * 1.6;
      if (p.life <= 0) particles.splice(i, 1);
    }

    const now = performance.now();
    while (trail.length && now - trail[0].t > 120) trail.shift();
  }

  function drawFruit(f) {
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.angle);
    if (f.isBomb) {
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(0, 0, f.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.12)';
      ctx.beginPath(); ctx.arc(-f.r * 0.35, -f.r * 0.35, f.r * 0.25, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#8a8a8a'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(0, -f.r); ctx.quadraticCurveTo(10, -f.r - 14, 22, -f.r - 8); ctx.stroke();
      ctx.fillStyle = '#ff4d1a';
      ctx.beginPath(); ctx.arc(22, -f.r - 8, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd33d';
      ctx.font = `bold ${Math.round(f.r * 0.9)}px Bangers, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('!', 0, 2);
    } else {
      const t = f.type;
      ctx.fillStyle = t.color;
      ctx.beginPath(); ctx.arc(0, 0, f.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.28)';
      ctx.beginPath(); ctx.arc(-f.r * 0.35, -f.r * 0.35, f.r * 0.22, 0, Math.PI * 2); ctx.fill();
      if (t.name === 'watermelon') {
        ctx.strokeStyle = '#1e7a2b'; ctx.lineWidth = 3;
        for (let k = 0; k < 6; k++) {
          const a = (k / 6) * Math.PI * 2;
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * f.r * 0.9, Math.sin(a) * f.r * 0.9); ctx.stroke();
        }
      } else if (t.name === 'kiwi') {
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, 0, f.r * 0.45, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#9ce05a'; ctx.beginPath(); ctx.arc(0, 0, f.r * 0.34, 0, Math.PI * 2); ctx.fill();
      } else if (t.name === 'apple' || t.name === 'orange' || t.name === 'lemon') {
        ctx.fillStyle = '#3d8c2e';
        ctx.beginPath(); ctx.ellipse(4, -f.r + 2, 7, 4, -0.5, 0, Math.PI * 2); ctx.fill();
      } else if (t.name === 'banana') {
        ctx.strokeStyle = t.color; ctx.lineWidth = f.r * 0.5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(0, f.r * 0.55, f.r * 0.95, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
        ctx.lineCap = 'butt';
      }
    }
    ctx.restore();
  }

  function drawHalf(h) {
    const t = h.type;
    const r = h.r;
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(h.cut);
    ctx.beginPath();
    ctx.rect(-r * 2, h.side > 0 ? 0 : -r * 2, r * 4, r * 2);
    ctx.clip();
    ctx.rotate(h.angle - h.cut);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = t.rind; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, r * 0.82, 0, Math.PI * 2);
    ctx.fillStyle = t.inner; ctx.fill();
    ctx.restore();
  }

  function drawTrail(now) {
    if (trail.length < 2) return;
    for (let i = 1; i < trail.length; i++) {
      const a = trail[i - 1], b = trail[i];
      const age = (now - b.t) / 120;
      const alpha = Math.max(0, 1 - age);
      ctx.strokeStyle = BLADES[activeBlade].color;
      ctx.globalAlpha = alpha * 0.9;
      ctx.lineWidth = Math.max(1, 12 * alpha);
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawBackground() {
    const t = THEMES[theme];
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, t.top);
    g.addColorStop(1, t.bottom);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);

    drawBackground();
    for (const h of halves) drawHalf(h);
    for (const f of fruits) drawFruit(f);
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawTrail(now);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
